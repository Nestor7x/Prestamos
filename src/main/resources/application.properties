spring.application.name=prestamos

# Puerto configurable dinamicamente por Render (variable PORT) o 8080 por defecto
server.port=${PORT:8080}
server.error.include-message=always

# Configuracion de conexion a base de datos (Supabase / Postgres)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.sqggfmbdsdkmgittppsm}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:80395157*NN}

# Optimizacion de HikariCP para poolers cloud (Supabase Supavisor)
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=60000

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
